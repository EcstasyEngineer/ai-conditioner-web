name: Deploy

# Manual trigger. Decisions this implements are recorded in docs/v1/DEPLOYMENT.md:
# base path `/`, no router, SPA fallback on every host, index.html uncached.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Deploying an unverified build is how a broken bundle reaches a real URL.
      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm run test:run

      - name: Build
        run: npm run build

      # DEPLOYMENT.md §3: hosts without a rewrite engine (GitHub Pages) serve
      # 404.html for unknown paths. Making it identical to index.html turns a
      # hard refresh into a normal load. Harmless everywhere else.
      - name: Install SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Verify the fallback is in place
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          cmp dist/index.html dist/404.html
          echo "SPA fallback verified: hard refresh on any path serves the shell"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypnoapp-${{ github.event.inputs.environment }}
          path: dist/
          retention-days: 14
